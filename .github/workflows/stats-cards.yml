# ════════════════════════════════════════════════════════════════════════════
# 📊 GitHub Stats Cards Generator
# ────────────────────────────────────────────────────────────────────────────
# Generates the stats / top-languages / pinned-repo cards as static SVGs and
# commits them to ./profile/ so the README never depends on an external
# uptime (the public github-readme-stats.vercel.app instance was shut down).
#
# Uses the official action maintained by the github-readme-stats team:
#   https://github.com/stats-organization/github-readme-stats-action
#
# Cards are generated for @BravesDevs (primary account). To track this
# account instead, change the `username=` option in each step to `de-waang`.
#
# Runs: on merge to main, daily at 03:00 UTC, and on manual dispatch.
# ════════════════════════════════════════════════════════════════════════════

name: 📊 Update README Stats Cards

on:
  schedule:
    - cron: "0 3 * * *" # daily at 03:00 UTC
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=BravesDevs&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true&rank_icon=github
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=BravesDevs&theme=tokyonight&hide_border=true&layout=compact&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Agentable.io pin card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=BravesDevs&repo=Agentable.io&theme=tokyonight&hide_border=true
          path: profile/pin-agentable.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Gujarati-Accent-Detection pin card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=BravesDevs&repo=Gujarati-Accent-Detection&theme=tokyonight&hide_border=true
          path: profile/pin-gujarati-accent.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "📊 Update README stats cards" || exit 0
          git push
